<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUILD/BENCH — PC Assembly Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111315; --panel:#17191cd9; --line:#2b2f33; --ink:#e8e4da; --dim:#8d9298;
  --acc:#ffb454; --accdim:#b57e33; --ok:#69d48b; --bad:#ff6a5e;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);
  font-family:"Space Grotesk",sans-serif;color:var(--ink)}
#c3d{position:fixed;inset:0;display:block;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 130% 100% at 50% 38%,transparent 55%,rgba(0,0,0,.5) 100%)}
.mono{font-family:"IBM Plex Mono",monospace}

#brand{position:fixed;top:18px;left:22px;z-index:10;user-select:none;pointer-events:none}
#brand h1{font-size:17px;font-weight:700;letter-spacing:.14em}
#brand h1 em{font-style:normal;color:var(--acc)}
#brand p{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim);
  letter-spacing:.22em;margin-top:3px}
#syschip{position:fixed;top:18px;right:64px;z-index:10;display:flex;gap:8px;align-items:center;
  border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:3px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em}
#sysdot{width:8px;height:8px;border-radius:50%;background:#4a4f54;transition:background .3s}
#iconbtns{position:fixed;top:18px;right:22px;z-index:11;display:flex;flex-direction:column;gap:6px}
.ibtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);border-radius:3px;color:var(--dim);transition:.15s}
.ibtn:hover{color:var(--acc);border-color:var(--accdim)}
.ibtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

#steps{position:fixed;left:22px;bottom:22px;z-index:10;width:238px;
  border:1px solid var(--line);background:var(--panel);border-radius:4px;overflow:hidden;
  backdrop-filter:blur(6px)}
#steps header{padding:9px 12px 7px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:baseline}
#steps header b{font-size:11px;letter-spacing:.18em;font-weight:600}
#steps header span{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--dim)}
#stepList{list-style:none;padding:6px 0}
#stepList li{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim);
  padding:4px 12px;display:flex;gap:9px;letter-spacing:.04em;cursor:pointer;transition:color .15s}
#stepList li:hover{color:var(--ink)}
#stepList li.done{color:#575c60;text-decoration:line-through}
#stepList li .n{color:var(--accdim);min-width:14px}
#stepList li.done .n{color:#45494d}
#stepList li.stamp{color:var(--ok);text-decoration:none;letter-spacing:.2em}
#disall{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;
  color:var(--dim);font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.22em;
  padding:7px;cursor:pointer}
#disall:hover{color:var(--bad)}

#info{position:fixed;right:22px;top:66px;bottom:150px;width:308px;z-index:10;
  border:1px solid var(--line);background:var(--panel);border-radius:4px;backdrop-filter:blur(8px);
  transform:translateX(360px);transition:transform .35s cubic-bezier(.2,.9,.25,1);
  display:flex;flex-direction:column}
#info.open{transform:none}
#infoHead{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
#infoEyebrow{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--acc);
  letter-spacing:.24em;display:flex;justify-content:space-between}
#infoEyebrow button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px;
  padding:0;line-height:1}
#infoTitle{font-size:19px;font-weight:700;margin-top:6px;letter-spacing:.02em}
#infoBody{padding:13px 16px;overflow-y:auto;flex:1}
#infoBody::-webkit-scrollbar{width:4px}
#infoBody::-webkit-scrollbar-thumb{background:var(--line)}
#infoDesc{font-size:12.5px;line-height:1.55;color:#c9c5bb}
#infoSpecs{margin-top:13px;border-top:1px dashed var(--line)}
#infoSpecs div{display:flex;justify-content:space-between;padding:6px 0;
  border-bottom:1px dashed var(--line);font-size:11px}
#infoSpecs dt{color:var(--dim);font-family:"IBM Plex Mono",monospace;letter-spacing:.06em}
#infoSpecs dd{text-align:right}
#infoTip{margin-top:13px;padding:9px 11px;border-left:2px solid var(--acc);
  background:#ffb45412;font-size:11.5px;line-height:1.5}

#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--ink);
  border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:3px;
  transition:opacity .25s;white-space:nowrap}
#hint kbd{color:var(--acc)}
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  padding:8px 14px;border-radius:3px;border:1px solid var(--line);background:#1b1d20ee;
  animation:tin .25s cubic-bezier(.2,.9,.3,1);max-width:78vw;text-align:center}
.toast.warn{border-color:#7a4438;color:#ffb3ab}
.toast.good{border-color:#3d6b4b;color:#a9e8bc}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
#nametag{position:fixed;z-index:15;pointer-events:none;display:none;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  background:#0f1012dd;border:1px solid var(--accdim);color:var(--acc);
  padding:4px 8px;border-radius:2px;transform:translate(14px,-50%)}
#cancelpick{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:12;
  display:none;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  color:var(--bad);border:1px solid #7a4438;background:#211512cc;padding:8px 18px;border-radius:3px;
  cursor:pointer}
@media(max-width:900px){#info{width:min(300px,88vw);right:12px}#steps{display:none}}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="vignette"></div>

<div id="brand"><h1>BUILD<em>/</em>BENCH</h1><p>PC ASSEMBLY SIMULATOR · REV 3.2</p></div>

<div id="syschip"><span id="sysdot"></span><span id="systxt">SYSTEM&nbsp;OFF</span></div>
<div id="iconbtns">
  <div class="ibtn" id="muteBtn" title="Sound">
    <svg viewBox="0 0 24 24" id="volIcon"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wav" d="M16 9a4 4 0 010 6"/></svg>
  </div>
  <div class="ibtn" id="helpBtn" title="Help">
    <svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 115.2 2c-.9.8-2.2 1.3-2.2 2.7"/><path d="M12 17.2v.1"/></svg>
  </div>
</div>

<div id="steps">
  <header><b>BUILD ORDER</b><span id="stepCount">0 / 8</span></header>
  <ol id="stepList"></ol>
  <button id="disall">DISASSEMBLE&nbsp;ALL</button>
</div>

<div id="info">
  <div id="infoHead">
    <div id="infoEyebrow"><span id="infoCat">—</span><button id="infoClose">✕</button></div>
    <div id="infoTitle">—</div>
  </div>
  <div id="infoBody">
    <p id="infoDesc"></p>
    <dl id="infoSpecs"></dl>
    <div id="infoTip"></div>
  </div>
</div>

<div id="hint">DRAG&nbsp;TO&nbsp;ORBIT&nbsp;·&nbsp;SCROLL&nbsp;TO&nbsp;ZOOM&nbsp;·&nbsp;<kbd>CLICK</kbd>&nbsp;A&nbsp;PART</div>
<button id="cancelpick">✕&nbsp;&nbsp;RETURN PART</button>
<div id="toasts"></div>
<div id="nametag"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* ============================ CORE ============================ */
const canvas=document.getElementById('c3d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x131518);
scene.fog=new THREE.Fog(0x131518,22,70);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);

(function(){
  const es=new THREE.Scene(); es.background=new THREE.Color(0x0a0b0c);
  const mk=function(w,h,x,y,z,ry,i,c){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({color:c||0xffffff}));
    m.material.color.multiplyScalar(i); m.position.set(x,y,z); m.rotation.y=ry; es.add(m);
  };
  mk(6,4,-6,4,0, Math.PI/2, 6);
  mk(6,4, 6,4,0,-Math.PI/2, 3);
  mk(8,4, 0,5,-6, 0, 2, 0xfff2df);
  mk(10,10,0,-6,0, Math.PI/2, .5);
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(es,.04).texture;
  pm.dispose();
})();

scene.add(new THREE.HemisphereLight(0x93a4b8,0x27231e,.38));
const key=new THREE.DirectionalLight(0xfff1de,1.15);
key.position.set(-6,10,5);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-12,right:12,top:12,bottom:-12,far:40});
key.shadow.camera.updateProjectionMatrix();
key.shadow.bias=-.0006;
key.shadow.radius=3;
scene.add(key);
const rim=new THREE.DirectionalLight(0x6f87ad,.5);
rim.position.set(6,6,-7); scene.add(rim);
const pool=new THREE.SpotLight(0xffe6c2,.85,20,.65,.55,1.4);
pool.position.set(-1,9,2); pool.target.position.set(-1.3,1,0);
scene.add(pool,pool.target);

/* ---------------- materials + textures ---------------- */
const Mt={
  steel:new THREE.MeshStandardMaterial({color:0x2a2d31,roughness:.5,metalness:.85}),
  alu:new THREE.MeshStandardMaterial({color:0xb6bbc1,roughness:.32,metalness:.95}),
  alumDark:new THREE.MeshStandardMaterial({color:0x494d52,roughness:.42,metalness:.9}),
  plastic:new THREE.MeshStandardMaterial({color:0x151618,roughness:.62,metalness:.15}),
  copper:new THREE.MeshStandardMaterial({color:0xa56a34,roughness:.32,metalness:1}),
  gold:new THREE.MeshStandardMaterial({color:0xc9a23a,roughness:.35,metalness:1}),
  nickel:new THREE.MeshStandardMaterial({color:0xc4c9cf,roughness:.25,metalness:1}),
  wood:new THREE.MeshStandardMaterial({color:0x37322b,roughness:.85})
};

function ctex(w,h,fn,srgb){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=8;
  if(srgb!==false)t.encoding=THREE.sRGBEncoding;
  return t;
}
const FONT='"IBM Plex Mono",monospace';

const hexTex=ctex(256,256,function(g,w,h){
  g.fillStyle='#0c0d0e'; g.fillRect(0,0,w,h);
  g.fillStyle='#000';
  const r=10;
  for(let row=0;row<12;row++)for(let col=0;col<12;col++){
    const x=col*r*3+((row%2)*r*1.5)+4, y=row*r*2.6+4;
    g.beginPath();
    for(let k=0;k<6;k++){
      const a=Math.PI/3*k+Math.PI/6;
      if(k)g.lineTo(x+r*Math.cos(a)*.82,y+r*Math.sin(a)*.82);
      else g.moveTo(x+r*Math.cos(a)*.82,y+r*Math.sin(a)*.82);
    }
    g.closePath(); g.fill();
  }
},false);

function stickerTex(lines,opts){
  opts=opts||{};
  const W=opts.w||512,H=opts.h||256;
  return ctex(W,H,function(g){
    g.fillStyle=opts.bg||'#17181a'; g.fillRect(0,0,W,H);
    g.strokeStyle=opts.fg||'#d8d2c4'; g.lineWidth=3;
    g.strokeRect(8,8,W-16,H-16);
    g.fillStyle=opts.acc||'#ffb454';
    if(opts.bar){
      for(let i=0;i<40;i++){
        if(Math.random()<.6)
          g.fillRect(16+i*(W-32)/40,H-30,2+Math.random()*3,16);
      }
    }
    g.fillStyle=opts.fg||'#d8d2c4';
    lines.forEach(function(ln){
      g.font=(ln[1]>=18?'700 ':'500 ')+ln[1]+'px '+FONT;
      g.textAlign='center';
      g.fillText(ln[0],W/2,ln[2]);
    });
  });
}

let _pcbTex=null;
function makePcbTex(){
  if(_pcbTex)return _pcbTex;
  _pcbTex=ctex(1024,1240,function(g,w,h){
    g.fillStyle='#101c22'; g.fillRect(0,0,w,h);
    g.strokeStyle='rgba(120,170,190,.10)'; g.lineWidth=1.4;
    let seed=9;
    const rnd=function(){seed=(seed*16807)%2147483647;return seed/2147483647;};
    for(let i=0;i<190;i++){
      let x=rnd()*w,y=rnd()*h;
      g.beginPath(); g.moveTo(x,y);
      for(let s=0;s<4;s++){
        const L=30+rnd()*110,d=Math.floor(rnd()*4)*Math.PI/2+(rnd()<.5?Math.PI/4:0);
        x+=Math.cos(d)*L; y+=Math.sin(d)*L; g.lineTo(x,y);
      }
      g.stroke();
    }
    for(let i=0;i<260;i++){
      g.fillStyle='rgba(190,200,205,'+(.08+rnd()*.12)+')';
      g.beginPath(); g.arc(rnd()*w,rnd()*h,1.6+rnd()*1.6,0,7); g.fill();
    }
    g.strokeStyle='rgba(225,232,238,.5)'; g.lineWidth=2;
    const lbl=function(txt,x,y,s,a){
      g.fillStyle='rgba(228,235,242,'+(a||.8)+')';
      g.font='600 '+s+'px '+FONT; g.fillText(txt,x,y);
    };
    g.strokeRect(330,340,120,120); lbl('SOCKET',332,332,14);
    for(let i=0;i<4;i++){g.strokeRect(618,250+i*66,196,40); lbl('DDR5_SLOT'+(i+1),622,268+i*66,13);}
    g.strokeRect(120,430,300,44); lbl('PCIE5_X16_1',126,420,14);
    g.strokeRect(120,600,220,44); lbl('PCIE4_X4',126,592,13);
    lbl('M2A_SB',330,660,13); g.strokeRect(330,610,170,36);
    g.strokeRect(760,120,220,60); lbl('EPS_8PIN',764,108,13);
    lbl('VRM PWR STAGE x14',60,320,15,.55);
    lbl('BCKT REV 3.2 · MADE FOR THE BENCH',60,1190,15,.5);
  });
  _pcbTex.anisotropy=16;
  return _pcbTex;
}

/* ---------------- shape helpers ---------------- */
function roundedRectShape(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function boxAt(w,h,d,mat,x,y,z){
  x=x||0;y=y||0;z=z||0;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  return m;
}

function buildFan(size,thick,frameMat,dark){
  const grp=new THREE.Group();
  const outer=roundedRectShape(size,size,size*.2);
  outer.holes.push(new THREE.Path().absarc(0,0,size*.445,0,Math.PI*2,true));
  const frame=new THREE.Mesh(new THREE.ExtrudeGeometry(outer,
    {depth:thick*.55,bevelEnabled:false,curveSegments:24}),frameMat);
  frame.position.z=-thick*.35; grp.add(frame);
  for(let i=0;i<3;i++){
    const st=boxAt(size*.42,thick*.11,thick*.05,Mt.plastic,0,0,-thick*.26);
    st.rotation.z=i*Math.PI*2/3; grp.add(st);
  }
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(size*.155,size*.155,thick*.5,24),
    dark||Mt.plastic);
  hub.rotation.x=Math.PI/2; hub.position.z=-thick*.02; grp.add(hub);
  const cap=new THREE.Mesh(new THREE.CircleGeometry(size*.145,24),
    new THREE.MeshStandardMaterial({
      map:stickerTex([['⌁ AXIAL-FLOW',22,118],[size>=1.1?'120 mm':'97 mm',17,158]],
        {bar:true,w:256,h:196}),roughness:.6}));
  cap.position.z=thick*.2; cap.rotation.y=Math.PI; grp.add(cap);
  const bl=new THREE.Shape();
  bl.moveTo(0,0);
  bl.quadraticCurveTo(size*.30,size*.10,size*.40,size*.02);
  bl.quadraticCurveTo(size*.30,-size*.16,0,-size*.055);
  bl.lineTo(0,0);
  const bg=new THREE.ExtrudeGeometry(bl,{depth:thick*.07,bevelEnabled:false});
  const rotor=new THREE.Group();
  for(let i=0;i<7;i++){
    const b=new THREE.Mesh(bg,new THREE.MeshStandardMaterial({color:0x232529,
      roughness:.55,metalness:.35,side:THREE.DoubleSide}));
    b.rotation.z=i*Math.PI*2/7; b.rotation.y=.62;
    b.translateY(size*.135);
    b.position.z=thick*.04;
    rotor.add(b);
  }
  grp.add(rotor);
  grp.userData.rotor=rotor;
  return grp;
}
const FANS=[];

/* ============================ STATIC SET ============================ */
const world=new THREE.Group(); scene.add(world);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(240,240),
  new THREE.MeshStandardMaterial({color:0x1a1c1e,roughness:.95}));
floor.rotation.x=-Math.PI/2; floor.position.y=-.72; floor.receiveShadow=true; world.add(floor);

const desk=boxAt(13.6,.72,7.6,Mt.wood,0,-.36,0);
desk.receiveShadow=true; desk.castShadow=true; world.add(desk);
world.add(boxAt(13.7,.05,7.7,Mt.alumDark,0,.015,0));

const BENCH={x:-1.5,z:0};
(function(){
  const g=new THREE.Group(); g.position.set(BENCH.x,0,BENCH.z);
  const legG=new THREE.BoxGeometry(.18,.95,.18);
  [[-1.62,-1.32],[1.62,-1.32],[-1.62,1.32],[1.62,1.32]].forEach(function(p){
    const l=new THREE.Mesh(legG,Mt.steel); l.position.set(p[0],.475,p[1]);
    l.castShadow=true; g.add(l);
    const ft=new THREE.Mesh(new THREE.CylinderGeometry(.11,.13,.05,16),Mt.plastic);
    ft.position.set(p[0],.025,p[1]); g.add(ft);
  });
  const plate=boxAt(3.5,.09,2.9,Mt.steel,0,1,0);
  plate.castShadow=true; plate.receiveShadow=true; g.add(plate);
  const sg=new THREE.CylinderGeometry(.055,.055,.13,12);
  [[-1.05,-1.28],[1.05,-1.28],[-1.05,1.28],[1.05,1.28],[-.15,.02]].forEach(function(p){
    const s=new THREE.Mesh(sg,Mt.gold); s.position.set(p[0],1.115,p[1]); g.add(s);
  });
  const rail=boxAt(3.5,.14,.16,Mt.steel,0,.72,-1.44);
  rail.castShadow=true; g.add(rail);
  const pbRing=new THREE.Mesh(new THREE.TorusGeometry(.11,.028,10,24),
    new THREE.MeshStandardMaterial({color:0x222222,roughness:.4,metalness:.6,
      emissive:0x223038,emissiveIntensity:.4}));
  pbRing.rotation.x=Math.PI/2; pbRing.position.set(1.25,.82,-1.44); g.add(pbRing);
  const pbCap=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.06,20),
    new THREE.MeshStandardMaterial({color:0x39424a,roughness:.35,metalness:.7}));
  pbCap.position.set(1.25,.82,-1.44); g.add(pbCap);
  world.add(g);
  window.__powerBtn={ring:pbRing,cap:pbCap};
})();

const ledStrip=new THREE.Mesh(new THREE.BoxGeometry(3.3,.02,.05),
  new THREE.MeshStandardMaterial({color:0x111111,emissive:0xffb454,emissiveIntensity:0}));
ledStrip.position.set(BENCH.x,.95,-1.47); world.add(ledStrip);

/* ---------- Q-Code debug LED ---------- */
const QCODE={last:'',ctx:null,tex:null};
(function(){
  const c=document.createElement('canvas'); c.width=128; c.height=96;
  QCODE.ctx=c.getContext('2d');
  QCODE.tex=new THREE.CanvasTexture(c);
  const m=new THREE.Mesh(new THREE.BoxGeometry(.26,.16,.03),
    new THREE.MeshBasicMaterial({map:QCODE.tex}));
  m.position.set(BENCH.x-.6,.76,-1.54); m.rotation.x=-.12; scene.add(m);
  qcodeDraw('--');
})();
function qcodeDraw(s){
  if(!QCODE.ctx)return;
  if(QCODE.last===s)return;
  QCODE.last=s;
  const g=QCODE.ctx;
  g.fillStyle='#160806'; g.fillRect(0,0,128,96);
  g.strokeStyle='#3a1410'; g.lineWidth=3; g.strokeRect(3,3,122,90);
  g.font='700 56px '+FONT; g.textAlign='center'; g.textBaseline='middle';

          .filter(function(id){return byId[id].state==='mounted';}).length;

function toast(msg,kind,key){
  const wrap=document.getElementById('toasts');
  let el=key?wrap.querySelector('[data-key="'+key+'"]'):null;
  if(!el){
    el=document.createElement('div');
    if(key)el.dataset.key=key;
    wrap.appendChild(el);
  }
  /* ALWAYS write the message, new or recycled */
  el.textContent=msg;
  el.className='toast'+(kind?' '+kind:'');
  el.style.transition='';
  el.style.opacity='';
  clearTimeout(el._t);
  /* restart the slide-in so refires don't look dead */
  el.style.animation='none';
  void el.offsetWidth;
  el.style.animation='';
  el._t=setTimeout(function(){
    el.style.transition='opacity .4s'; el.style.opacity='0';
    setTimeout(function(){el.remove();},450);
  },3600);
}

const SND={ctx:null,muted:false};
function actx(){
  if(!SND.ctx){
    try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  }
  return SND.ctx;
}
function tone(f,t0,dur,type,vol){
  const c=actx(); if(!c||SND.muted)return;
  const o=c.createOscillator(),gn=c.createGain();
  o.type=type||'square'; o.frequency.value=f;
  gn.gain.setValueAtTime(vol||.06,c.currentTime+t0);
  gn.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+dur);
  o.connect(gn); gn.connect(c.destination);
  o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.02);
}
function softBlip(f){tone(f,0,.06,'triangle',.04);}
function beepPattern(n){for(let i=0;i<n;i++)tone(n===1?880:587,i*.28,.14);}

function killElectrics(){
  TH.powered=false; TH.trip=false;
  SYS.state='off';
  fanTarget=0;
  GPUSTRIP&&(GPUSTRIP.emissiveIntensity=0);
  RAMBARS.forEach(function(m){m.emissiveIntensity=0;m.emissive.setHex(0x000000);});
  window.__powerBtn.ring.material.emissive.setHex(0x223038);
  setChip('SYSTEM OFF','#4a4f54');
  monSetLed(0x303030);
  pwLabel();
}
/* Every shutdown passes through here; the monitor ALWAYS ends black. */
function stopPower(opts){
  opts=opts||{};
  killElectrics();
  BT.active=false; BT.steps=[]; BT.i=0;
  MON.inOs=false; MON.freeze=false; MON.halted=null;
  MON.on=false;
  if(opts.crt){
    MON.collapse=0.0001;            /* play the collapse, end on enforced black */
  }else{
    MON.collapse=1;                 /* instantly blank */
    scOff();
  }
  qcodeDraw('--');
}
function gracefulService(reason){
  if(!TH.powered)return;
  stopPower({crt:true});
  toast(reason,'warn','service');
}
function shutdownByUser(){
  if(SYS.state==='off'){softBlip(240);return;}
  stopPower({crt:true});
  tone(392,0,.08,'square',.03);
}
function attemptPower(){
  actx();
  const c=SND.ctx; if(c&&c.state==='suspended')c.resume();
  if(holding)endHold(false);
  const st=function(id){return byId[id].state==='mounted';};

  if(!st('psu')){
    toast('You press the button — dead nothing. No PSU is connected.','warn','nopwr');
    tone(150,0,.07,'square',.03);
    return;
  }
  if(!st('motherboard')){
    toast('Click. Nothing wake-able — the board is not seated.','warn','nopwr');
    tone(150,0,.07,'square',.03);
    return;
  }

  /* power rails come up — label NOW; every branch below inherits it */
  SYS.state='on';
  TH.powered=true; TH.trip=false;
  MON.on=true; MON.freeze=false; MON.halted=null; MON.inOs=false;
  MON.elapsed=0; MON.collapse=0; MON._blackUp=false;
  BT.active=false;
  fanTarget=.25;
  pwLabel();

  if(GPUSTRIP)GPUSTRIP.emissiveIntensity=.6;
  RAMBARS.forEach(function(m,i){m.emissive.setHSL(.55+i*.09,.5,.4);m.emissiveIntensity=.5;});
  window.__powerBtn.ring.material.emissive.setHex(0x69d48b);
  monSetLed(0x69d48b);

  if(!st('cpu')){
    setChip('NO POST','');
    toast('Fans stutter… then silence. No processor — nothing to POST.','warn','nopwr');
    const gOk=function(){return SYS.state==='on'&&byId.cpu.state!=='mounted';};
    setTimeout(function(){ if(gOk())stopPower({}); },1600);
    return;
  }

  fanTarget=1;
  const ramN=(st('ram1')?1:0)+(st('ram2')?1:0);
  setChip('POST …','#69d48b');
  bootTimelineBuild({
    rams:ramN,
    gpu:st('gpu'),
    ssd:st('ssd')
  });
}
function overTempTrip(){
  if(!TH.powered||TH.trip)return;
  TH.trip=true;
  tone(233,0,.55,'sawtooth',.07);
  tone(233,.7,.55,'sawtooth',.07);
  tone(175,1.4,.8,'sawtooth',.06);
  MON.halted='overheat';
  qcodeDraw('EA');
  setChip('OVERHEAT','#ff6a5e'); monSetLed(0xff5a4e);
  /* hold the alarm so it's readable, then a NORMAL shutdown:
     collapse + guaranteed blank, rails off, one press to reboot */
  setTimeout(function(){
    if(!TH.trip)return;
    stopPower({crt:true});
  },1400);
}

document.getElementById('cancelpick').insertAdjacentHTML('afterend',
 '<button id="pw" class="mono" style="position:fixed;right:22px;bottom:22px;z-index:10;'
 +'letter-spacing:.18em;font-size:11px;padding:11px 20px;border-radius:3px;cursor:pointer;'
 +'border:1px solid var(--line);background:var(--panel);color:var(--ink)">'
 +'⏻&nbsp;&nbsp;POWER&nbsp;ON</button>');
const pwBtn=document.getElementById('pw');
function pwLabel(){
  pwBtn.innerHTML=SYS.state==='off'
    ?'⏻&nbsp;&nbsp;POWER&nbsp;ON'
    :'⏻&nbsp;&nbsp;SHUT&nbsp;DOWN';
}
pwLabel();
pwBtn.onclick=function(){
  if(SYS.state==='off')attemptPower(); else shutdownByUser();
};

/* ============================ RULES ============================ */
function whyNot(id){
  const st=function(x){return byId[x].state==='mounted';};
  if(['cpu','cooler','ram1','ram2','ssd','gpu'].indexOf(id)>=0
     &&!st('motherboard'))return 'Seat the motherboard on the standoffs first.';
  if(id==='cooler'&&!st('cpu'))return 'Mount the CPU before dropping the cooler on it.';
  if(id==='cpu'&&st('cooler'))return 'The cooler covers the socket — remove it first.';
  return null;
}
function disallowRemoval(id){
  const st=function(x){return byId[x].state==='mounted';};
  if(id==='cpu'&&st('cooler'))return 'Detach the cooler before pulling the CPU.';
  if(id==='motherboard'){
    const others=['cpu','cooler','ram1','ram2','ssd','gpu'].filter(st);
    if(others.length)return 'Empty the board first (still has: '+others.join(', ')+')';
  }
  return null;
}

/* ============================ INTERACTION ============================ */
const camState={az:-.65,el:.46,dist:9.8,tgt:new THREE.Vector3(-.6,1.15,0)};
function applyCam(){
  camState.el=Math.max(.14,Math.min(1.42,camState.el));
  camState.dist=Math.max(4,Math.min(17,camState.dist));
  camera.position.set(
    camState.tgt.x+camState.dist*Math.cos(camState.el)*Math.cos(camState.az),
    camState.tgt.y+camState.dist*Math.sin(camState.el),
    camState.tgt.z+camState.dist*Math.cos(camState.el)*Math.sin(camState.az));
  camera.lookAt(camState.tgt);
}
applyCam();

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
const holdPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-2.45);
const HOLD_Y=2.45,FLAT_SNAP=1.55;
let hover=null,holding=null,orbitDrag=false,downXY=null,ptrDown=false,magnet=null;
const nametag=document.getElementById('nametag');

function compFromHit(o){
  while(o){if(o.userData.pid)return o.userData.pid;o=o.parent;}
  return null;
}
function setPtr(e){
  ptr.x=e.clientX/innerWidth*2-1;
  ptr.y=-(e.clientY/innerHeight)*2+1;
}
function pickPart(){
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(PARTS.map(function(p){return p.obj;}),true);
  return hits.length?compFromHit(hits[0].object):null;
}

const bracketTex=ctex(256,256,function(g){
  g.strokeStyle='#ffffff'; g.lineWidth=13; g.lineCap='round';
  const L=64,P=10;
  [[P,P,1,1],[246-P,P,-1,1],[P,246-P,1,-1],[246-P,246-P,-1,-1]].forEach(function(cp){
    g.beginPath();
    g.moveTo(cp[0]+cp[2]*L,cp[1]); g.lineTo(cp[0],cp[1]); g.lineTo(cp[0],cp[1]+cp[3]*L);
    g.stroke();
  });
},false);
const brackets=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5),
  new THREE.MeshBasicMaterial({map:bracketTex,transparent:true,opacity:.9,
    depthTest:false,blending:THREE.AdditiveBlending}));
brackets.visible=false; brackets.renderOrder=99; scene.add(brackets);

function beginHold(id){
  const p=byId[id];
  if(p.state==='mounted'){
    if(TH.powered)gracefulService('Hardware touched while running — safe shutdown.');
    const rem=disallowRemoval(id);
    if(rem){toast(rem,'warn','rule');return;}
    p.state='held'; holding=id;
    softBlip(180);
    refreshCables();
  }else{
    const deny=whyNot(id);
    if(deny){toast(deny,'warn','rule');return;}
    p.state='held'; holding=id;
    softBlip(520);
  }
  showHint('<kbd>CLICK</kbd> VALID SITE TO INSTALL · <kbd>RMB</kbd> / ✕ TO RETURN');
  document.getElementById('cancelpick').style.display='block';
  openInfo(p.def);
}
function endHold(installHere){
  if(!holding)return;
  const p=byId[holding];
  holding=null;
  brackets.visible=false; magnet=null;
  document.getElementById('cancelpick').style.display='none';
  if(installHere){
    p.state='animating';
    animMove(p.obj,p.def.anchor.pos,.38,easeBack,function(){
      p.state='mounted';
      softBlip(880);
      refreshChecklist(); refreshCables();
    });
    animQuat(p.obj,p.def.anchor.quat,.38);
    if(p.def.id==='ssd'){
      const q1=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI*.32,0,0));
      const v1=p.def.anchor.pos.clone().add(new THREE.Vector3(0,.34,.12));
      animMove(p.obj,v1,.22,easeOut,function(){
        animQuat(p.obj,p.def.anchor.quat,.16);
        animMove(p.obj,p.def.anchor.pos,.16,easeIn,null);
      });
      animQuat(p.obj,q1,.22);
    }
    if(p.def.id==='ram1'||p.def.id==='ram2')softBlip(760);
  }else{
    p.state='animating';
    animMove(p.obj,p.def.tray,.45,easeOut,function(){p.state='tray';refreshCables();});
    animQuat(p.obj,p.def.trayQ,.45);
    softBlip(240);
  }
}

const anims=[];
function easeOut(t){return 1-Math.pow(1-t,3);}
function easeIn(t){return t*t*t;}
function easeBack(t){const c=1.7;t--;return 1+t*t*((c+1)*t+c);}
function animMove(o,to,dur,ease,done){
  const from=o.position.clone();
  anims.push({t:0,dur:dur,ease:ease,done:done,
    step:function(k){o.position.lerpVectors(from,to,k);}});
}
function animQuat(o,toQ,dur){
  const from=o.quaternion.clone(),tq=toQ.clone();
  anims.push({t:0,dur:dur,ease:easeOut,
    step:function(k){o.quaternion.copy(from).slerp(tq,k);}});
}

canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
addEventListener('pointermove',function(e){
  setPtr(e);
  if(ptrDown&&!holding){
    if(downXY&&Math.hypot(e.clientX-downXY.x,e.clientY-downXY.y)>5)orbitDrag=true;
    if(orbitDrag&&downXY){
      camState.az-=(e.clientX-downXY.x)*.0055;
      camState.el+=(e.clientY-downXY.y)*.0045;
      applyCam();
      downXY={x:e.clientX,y:e.clientY};
    }
  }
});
canvas.addEventListener('pointerdown',function(e){
  ptrDown=true; downXY={x:e.clientX,y:e.clientY}; orbitDrag=false; setPtr(e);
  if(e.button===2&&holding)endHold(false);
});
addEventListener('pointerup',function(e){
  if(e.button!==0){ptrDown=false;return;}
  const wasDrag=orbitDrag;
  ptrDown=false; orbitDrag=false;
  if(wasDrag||!downXY)return;
  setPtr(e);
  if(holding){
    ray.setFromCamera(ptr,camera);
    const hp=new THREE.Vector3();
    if(ray.ray.intersectPlane(holdPlane,hp)&&magnet&&magnet.valid)endHold(true);
    else endHold(false);
  }else{
    const id=pickPart();
    if(id)beginHold(id);
  }
});
canvas.addEventListener('wheel',function(e){
  camState.dist*=1+Math.sign(e.deltaY)*.09; applyCam();
},{passive:true});
document.getElementById('cancelpick').onclick=function(){endHold(false);};
addEventListener('keydown',function(e){
  if(e.key==='Escape'&&holding)endHold(false);
  if(e.key==='r'||e.key==='R'){
    camState.az=-.65;camState.el=.46;camState.dist=9.8;applyCam();
  }
});

/* ============================ UI ============================ */
const ORDER=['motherboard','cpu','cooler','ram1','ram2','ssd','gpu','psu'];
const $list=document.getElementById('stepList');
ORDER.forEach(function(id,i){
  const li=document.createElement('li'); li.dataset.id=id;
  li.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span>'+byId[id].def.short;
  li.onclick=function(){focusPart(id);};
  $list.appendChild(li);
});
function refreshChecklist(){
  const done=ORDER.filter(function(id){return byId[id].state==='mounted';}).length;
  document.getElementById('stepCount').textContent=done+' / '+ORDER.length;
  Array.prototype.forEach.call($list.children,function(li){
    if(li.dataset.id)li.classList.toggle('done',byId[li.dataset.id].state==='mounted');
  });
  let stamp=$list.querySelector('.stamp');
  const all=ORDER.every(function(id){return byId[id].state==='mounted';});
  if(all&&!stamp){
    stamp=document.createElement('li');
    stamp.className='stamp'; stamp.textContent='▸ SYSTEM READY';
    $list.appendChild(stamp);
  }
  if(!all&&stamp)stamp.remove();
}
refreshChecklist();

let camAnim=null;
function focusPart(id){
  const p=byId[id]; if(!p)return;
  camAnim={from:camState.tgt.clone(),to:p.obj.position.clone(),t:0,dur:.6};
  openInfo(p.def);
}
function showHint(html){document.getElementById('hint').innerHTML=html;}
const info$=document.getElementById('info');
function openInfo(def){
  document.getElementById('infoCat').textContent=def.cat+' · SPEC SHEET';
  document.getElementById('infoTitle').textContent=def.name;
  document.getElementById('infoDesc').textContent=def.desc;
  const sp=document.getElementById('infoSpecs'); sp.innerHTML='';
  def.specs.forEach(function(pair){
    const d=document.createElement('div');
    d.innerHTML='<dt>'+pair[0]+'</dt><dd>'+pair[1]+'</dd>';
    sp.appendChild(d);
  });
  document.getElementById('infoTip').innerHTML='<b>BUILDER’S NOTE — </b>'+def.tip;
  info$.classList.add('open');
}
document.getElementById('infoClose').onclick=function(){info$.classList.remove('open');};
document.getElementById('disall').onclick=function(){
  if(holding)endHold(false);
  if(SYS.state!=='off')stopPower({crt:true});
  ['gpu','ssd','ram2','ram1','cooler','cpu','psu','motherboard'].forEach(function(id,i){
    const p=byId[id];
    if(p.state==='mounted'){
      p.state='animating';
      setTimeout(function(){
        animMove(p.obj,p.def.tray,.4,easeOut,function(){p.state='tray';});
        animQuat(p.obj,p.def.trayQ,.4);
      },i*140);
    }
  });
  toast('Teardown — components returned to the mat.','good','teardown');
  setTimeout(function(){refreshChecklist();refreshCables();},1400);
};
document.getElementById('muteBtn').onclick=function(){
  SND.muted=!SND.muted;
  document.querySelector('#volIcon .wav').style.opacity=SND.muted?0:1;
  this.style.color=SND.muted?'var(--bad)':'';
};
document.getElementById('helpBtn').onclick=function(){
  toast('CLICK part to pick up · aim over its dock until brackets turn GREEN, CLICK to seat.'
    +' The monitor runs a real POST — read it to diagnose faults.','good','help');
};

/* ============================ FRAME LOOP ============================ */
const clock=new THREE.Clock();
const tmpV=new THREE.Vector3();

function thermalStep(dt){
  const cool=byId.cooler.state==='mounted';
  if(TH.powered&&cool){
    TH.temp+=(61-TH.temp)*Math.min(1,dt*.55);
  }else if(TH.powered&&!cool){
    TH.temp+=dt*14;
    if(!TH.trip&&TH.temp>=97)overTempTrip();
  }else{
    TH.temp+=(32-TH.temp)*Math.min(1,dt*.5);
  }
}

function paintScreen(){
  if(MON.inOs){scDesktop();return;}
  if(MON.halted==='overheat'){scOverheat();return;}
  if(MON.on){scPostFrame();return;}
  scOff();
}

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta()),t=clock.elapsedTime;

  for(let i=anims.length-1;i>=0;i--){
    const a=anims[i]; a.t+=dt/a.dur;
    a.step(a.ease(Math.min(a.t,1)));
    if(a.t>=1){if(a.done)a.done();anims.splice(i,1);}
  }
  if(camAnim){
    camAnim.t+=dt/camAnim.dur;
    camState.tgt.lerpVectors(camAnim.from,camAnim.to,easeOut(Math.min(camAnim.t,1)));
    if(camAnim.t>=1)camAnim=null;
    applyCam();
  }

  /* hover */
  if(!holding&&!ptrDown){
    const id=pickPart();
    if(id!==hover){hover=id;canvas.style.cursor=id?'grab':'default';}
  }
  if(hover&&!holding){
    const p=byId[hover];
    tmpV.copy(p.obj.position); tmpV.y+=1.1; tmpV.project(camera);
    nametag.style.display='block';
    nametag.style.left=((tmpV.x*.5+.5)*innerWidth)+'px';
    nametag.style.top=((-tmpV.y*.5+.5)*innerHeight)+'px';
    nametag.textContent=p.def.name.toUpperCase();
  }else nametag.style.display='none';

  /* magnetism */
  magnet=null;
  if(holding){
    const p=byId[holding];
    ray.setFromCamera(ptr,camera);
    if(!ray.ray.intersectPlane(holdPlane,tmpV))tmpV.copy(p.obj.position);
    tmpV.y=HOLD_Y+Math.sin(t*3.2)*.04;
    const anch=p.def.anchor.pos;
    const flat=Math.hypot(tmpV.x-anch.x,tmpV.z-anch.z);
    const valid=flat<FLAT_SNAP&&(!p.def.ram||byId.motherboard.state==='mounted');
    if(valid){
      tmpV.lerp(anch,.5);
      p.obj.quaternion.slerp(p.def.anchor.quat,.12);
    }
    p.obj.position.lerp(tmpV,.28);
    magnet={valid:valid};
    brackets.visible=true;
    brackets.position.set(anch.x,anch.y+.55,anch.z);
    brackets.lookAt(camera.position);
    brackets.material.color.setHex(valid?0x69d48b:0xffb454);
    brackets.material.opacity=.35+Math.sin(t*(valid?9:5))*.06;
    const sc=valid?.8:1; brackets.scale.set(sc,sc,sc);
  }

  /* fans */
  fanLevel+=(fanTarget-fanLevel)*Math.min(1,dt*2.2);
  FANS.forEach(function(f,i){
    if(f.userData.rotor)f.userData.rotor.rotation.z-=dt*(2+fanLevel*22)*(i%2?-1:1);
  });

  /* thermals */
  thermalStep(dt);

  /* RGB accents */
  const hueBase=(t*.06)%1;
  if(TH.powered&&!TH.trip){
    RAMBARS.forEach(function(m,i){
      m.emissive.setHSL((hueBase+i*.09)%1,.85,.55);
      m.emissiveIntensity=1.2;
    });
    if(GPUSTRIP){
      GPUSTRIP.emissive.setHSL((hueBase+.5)%1,.8,.5);
      GPUSTRIP.emissiveIntensity=.9;
    }
    ledStrip.material.emissive.setHex(0xffb454);
    ledStrip.material.emissiveIntensity=1.4+Math.sin(t*4)*.3;
  }else if(TH.trip){
    ledStrip.material.emissive.setHex(0xff4438);
    ledStrip.material.emissiveIntensity=Math.max(0,Math.sin(t*9))*2;
  }else{
    ledStrip.material.emissiveIntensity*=.9;
  }
  window.__powerBtn.ring.material.emissiveIntensity=
    SYS.state==='off'?(.5+Math.sin(t*2)*.2):1.2;

  /* ---- SCREEN: single flow; texture upload can never be skipped ---- */
  try{
    if(MON.collapse>0){
      /* shutting down: animate the collapse, then ENFORCE black every frame */
      if(MON.collapse<1){
        MON.collapse=Math.min(1,MON.collapse+dt*3.2);
        if(MON.collapse<1)scCollapse(MON.collapse);
        else scOff();
      }else{
        scOff();
      }
      MON.tex.needsUpdate=true;
      MON._blackUp=false;
    }else{
      /* advance the master clock while powered */
      if(TH.powered&&!MON.freeze&&(BT.active||MON.inOs)){
        MON.elapsed+=dt;
        if(BT.active){
          while(BT.i<BT.steps.length&&BT.steps[BT.i].t<=MON.elapsed){
            BT.steps[BT.i].f(); BT.i++;
          }
        }
        const L=MON.lineMap;
        if(BT.active&&L.memVal&&!L.memVal.done&&MON.elapsed<BT.memT1){
          const k=Math.max(0,Math.min(1,(MON.elapsed-BT.memT0)/(BT.memT1-BT.memT0)));
          L.memVal.text='Testing Memory : '+Math.floor(BT.memTotal*k)+' MB';
        }
        if(BT.active&&BT.barT1>BT.barT0&&L.bar!=null){
          const k=Math.max(0,Math.min(1,(MON.elapsed-BT.barT0)/(BT.barT1-BT.barT0)));
          L.bar=k;
        }
      }
      if(MON.inOs)MON.osUp+=dt;
      paintScreen();

      /* upload when live; upload ONCE when settled black (perf courtesy) */
      const idleBlank=(!MON.on&&!MON.inOs&&!TH.powered);
      if(idleBlank){
        if(!MON._blackUp){MON.tex.needsUpdate=true;MON._blackUp=true;}
      }else{
        MON.tex.needsUpdate=true;
        MON._blackUp=false;
      }
    }
  }catch(err){
    qcodeDraw('FF');
    console.error('[monitor]',err);
  }

  renderer.render(scene,camera);
}
loop();

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

setTimeout(function(){
  toast('Welcome to the bench. Mount bay 01 first — then POWER ON and read the screen.','good','welcome');
},700);
</script>
</body>
</html>
